name: iOS App Store build

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "CFBundleVersion to stamp (defaults to the run number)"
        required: false
        type: string
      upload:
        description: "Upload the .ipa to App Store Connect"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "ios-v*"

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  archive:
    name: Archive and upload
    runs-on: macos-14
    timeout-minutes: 60

    env:
      SCHEME: App
      CONFIGURATION: Release
      WORKSPACE: ios/App/App.xcworkspace
      ARCHIVE_PATH: ${{ github.workspace }}/build/TipTapGames.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/build/export
      NEXT_PUBLIC_API_ORIGIN: ${{ vars.NEXT_PUBLIC_API_ORIGIN || 'https://tip-tap-games-roan.vercel.app' }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Select the latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build the static bundle that ships inside the binary
        run: npm run build:native

      - name: Sync the native project
        run: npx cap sync ios

      - name: Resolve the build number
        id: build_number
        run: |
          NUM="${{ inputs.build_number }}"
          if [ -z "$NUM" ]; then NUM="${{ github.run_number }}"; fi
          echo "value=$NUM" >> "$GITHUB_OUTPUT"
          echo "Stamping CFBundleVersion $NUM"

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install --repo-update

      - name: Create a build keychain and import the distribution certificate
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/dist.p12"
          echo "BUILD_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Install the App Store provisioning profile
        id: profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
          cp "$RUNNER_TEMP/profile.mobileprovision" "$PROFILES/$UUID.mobileprovision"
          echo "uuid=$UUID" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Installed profile $NAME ($UUID)"

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            CURRENT_PROJECT_VERSION="${{ steps.build_number.outputs.value }}" \
            OTHER_CODE_SIGN_FLAGS="--keychain $BUILD_KEYCHAIN"

      - name: Write the export options
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p build
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.nicvandewetering.tiptapgames</key>
              <string>${{ steps.profile.outputs.uuid }}</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Export the .ipa
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath "$EXPORT_PATH"
          ls -la "$EXPORT_PATH"

      - name: Upload the build to App Store Connect
        if: ${{ github.event_name == 'push' || inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          IPA=$(ls "$EXPORT_PATH"/*.ipa | head -n1)
          xcrun altool --validate-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Keep the .ipa as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TipTapGames-ipa-${{ steps.build_number.outputs.value }}
          path: ${{ github.workspace }}/build/export
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove the build keychain
        if: always()
        run: |
          if [ -n "${BUILD_KEYCHAIN:-}" ]; then
            security delete-keychain "$BUILD_KEYCHAIN" || true
          fi
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${{ steps.profile.outputs.uuid }}.mobileprovision" || true
